[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "influence-functions"
version = "0.1.0"
description = "K-FAC influence functions for LLMs, applied to detecting insecure and malicious generated code."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "asdfghjkl>=0.1a5",  # installs the `asdl` module
    "detoxify>=0.5.2",
    "numpy>=2.4.3",
    "semgrep",  # called as a command-line tool by the Semgrep losses
    "torch>=2.10.0",
    "tqdm>=4.67.3",
    "transformers>=5.3.0",
]

[project.optional-dependencies]
# Training-data estimation (IF.Data)
data = [
    "datasets>=4.7.0",
    "sentence-transformers>=5.2.3",
]
# 4-bit model loading (experiments/influence.py --load_in_4bit); CUDA only
quant = [
    "bitsandbytes>=0.49.2",
]
# Analysis scripts in experiments/
experiments = [
    "bandit",  # static baseline in experiments/detectors.py
    "scikit-learn",
    "scipy",
]
all = [
    "influence-functions[data,quant,experiments]",
]

[tool.setuptools.packages.find]
where = ["src"]
